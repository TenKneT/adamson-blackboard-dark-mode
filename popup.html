<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adamson Blackboard Dark Mode</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <h1>Adamson Blackboard</h1>
  <label class="setting" for="enabled">
    <span>Dark mode</span>
    <input id="enabled" type="checkbox" role="switch" disabled>
  </label>
  <p id="status" role="status" aria-live="polite">Loading your setting…</p>
  <p class="hint">Applies only to adamson.blackboard.com. Your choice is saved on this device.</p>
  <p class="hint">If the page stays light, allow this extension to run on the site in Firefox, then refresh Blackboard.</p>
</body>
</html>
